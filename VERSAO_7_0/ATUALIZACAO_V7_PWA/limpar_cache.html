<!DOCTYPE html>
<html><meta charset='UTF-8'><title>Limpar Cache - Vooalto V7</title>
<style>body{font-family:Arial,sans-serif;background:#050505;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;flex-direction:column}h1{color:#64FFDA;margin-bottom:10px}p{color:#aaa;font-size:13px;margin:6px 0}.status{font-size:11px;color:#888;margin-top:14px}</style>
</head><body>
<h1>Limpando Cache V7...</h1>
<p>Removendo service worker, caches, localStorage e sessionStorage</p>
<div class="status" id="status">Processando...</div>
<script>
(async()=>{
  const s=document.getElementById('status');
  try{
    if('serviceWorker'in navigator){
      s.textContent='Desregistrando service workers...';
      const regs=await navigator.serviceWorker.getRegistrations();
      for(let x of regs){await x.unregister();}
      s.textContent+=' OK ('+regs.length+')';
    }
    if('caches'in window){
      s.textContent=' | Limpando caches...';
      const keys=await caches.keys();
      for(let x of keys){await caches.delete(x);}
      s.textContent+=' OK ('+keys.length+')';
    }
    localStorage.clear();
    sessionStorage.clear();
    s.textContent=' | localStorage/sessionStorage OK';
  }catch(e){s.textContent='Erro: '+e.message;}
  s.textContent+=' | Redirecionando...';
  setTimeout(()=>{location.replace('./?v=4&fresh='+Date.now());},1500);
})();
</script>
</body></html>
