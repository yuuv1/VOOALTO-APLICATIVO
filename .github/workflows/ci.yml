name: CI

# O repositório não tinha nenhuma automação: a suíte só rodava na máquina de
# quem lembrava de rodar. São ~80 segundos e é o que impede a volta dos erros
# de dinheiro, de restauração de backup e de precache do service worker.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: VERSAO_10_0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: VERSAO_10_0/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: npm ci

      # Cada suíte roda isolada e o nome do arquivo vai para uma anotação.
      # Assim uma falha no Windows diz QUAL suíte caiu — sem isso o log do
      # runner fica atrás de um blob assinado difícil de abrir.
      - name: Suíte JS (jsdom)
        shell: bash
        run: |
          falhas=0
          for suite in tests/test_*.js; do
            echo "▸ $suite"
            if ! node "$suite"; then
              echo "::error title=Suíte JS falhou::$suite"
              falhas=$((falhas + 1))
            fi
          done
          test "$falhas" -eq 0

      - name: Suíte Python (build + contrato + servidor)
        run: npm run test:python

      - name: O sw.js commitado corresponde ao conteúdo do app?
        shell: bash
        run: |
          python build_v10_pwa.py
          if ! git diff --quiet -- ATUALIZACAO_V10/sw.js; then
            echo "::error title=sw.js dessincronizado::O sw.js commitado não corresponde ao conteúdo do app. Rode 'npm run build' e commite."
            git diff --stat -- ATUALIZACAO_V10/sw.js
            git diff -- ATUALIZACAO_V10/sw.js | head -40
            exit 1
          fi
          echo "sw.js em sincronia com o conteúdo do app."
