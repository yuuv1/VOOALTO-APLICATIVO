/* V5 - CORREÇÃO DEFINITIVA DA GRADE EXPANDIDA A4 */
.columns.expanded{
  height:calc(100vh - 180px)!important;
  overflow:hidden!important;
}
.columns.expanded .column.expanded{
  height:100%!important;
  overflow:hidden!important;
}
.columns.expanded .column.expanded .dropzone{
  display:grid!important;
  grid-template-columns:repeat(auto-fill,minmax(230px,260px))!important;
  grid-auto-rows:560px!important;
  gap:22px!important;
  align-items:start!important;
  align-content:start!important;
  justify-content:start!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  padding:20px!important;
}
.columns.expanded .expanded-pdf-card{
  width:100%!important;
  height:560px!important;
  min-height:560px!important;
  max-height:560px!important;
  aspect-ratio:auto!important;
  margin:0!important;
  padding:10px!important;
  display:flex!important;
  flex-direction:column!important;
  gap:8px!important;
  overflow:hidden!important;
  align-self:start!important;
  justify-self:start!important;
  position:relative!important;
  transform:none!important;
}
.columns.expanded .expanded-pdf-card:hover{
  transform:none!important;
}
.columns.expanded .expanded-pdf-date{
  flex:0 0 30px!important;
  height:30px!important;
  min-height:30px!important;
  max-height:30px!important;
  margin:0!important;
  width:100%!important;
}
.columns.expanded .expanded-pdf-sheet{
  flex:1 1 auto!important;
  height:calc(100% - 38px)!important;
  min-height:0!important;
  width:auto!important;
  max-width:95%!important;
  aspect-ratio:210/297!important;
  margin:0 auto!important;
  display:block!important;
  overflow:hidden!important;
}
.columns.expanded .expanded-pdf-sheet iframe{
  width:100%!important;
  height:100%!important;
  display:block!important;
  border:0!important;
  overflow:hidden!important;
}
.columns.expanded .expanded-pdf-loading,
.columns.expanded .expanded-pdf-empty{
  height:100%!important;
  min-height:100%!important;
}
@media(min-width:1600px){
  .columns.expanded .column.expanded .dropzone{grid-template-columns:repeat(auto-fill,minmax(260px,290px))!important;grid-auto-rows:620px!important;}
  .columns.expanded .expanded-pdf-card{height:620px!important;min-height:620px!important;max-height:620px!important;}
}
@media(max-width:900px){
  .columns.expanded .column.expanded .dropzone{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))!important;grid-auto-rows:470px!important;}
  .columns.expanded .expanded-pdf-card{height:470px!important;min-height:470px!important;max-height:470px!important;}
}

/* V5 - Preview PDF via canvas/pdf.js no modo expandido */
.expanded-pdf-sheet canvas{
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  display:block!important;
  background:#fff!important;
}
.expanded-pdf-sheet.pdf-canvas-ready{
  background:#fff!important;
}
.expanded-pdf-sheet iframe.fallback-pdf{
  width:100%!important;
  height:100%!important;
  border:0!important;
  background:#fff!important;
}

/* V5 - PDF canvas ocupa folha A4 completa */
.expanded-pdf-sheet.pdf-canvas-ready{display:flex!important;align-items:center!important;justify-content:center!important;background:#fff!important}
.expanded-pdf-sheet.pdf-canvas-ready canvas{width:100%!important;height:100%!important;object-fit:contain!important;background:#fff!important;display:block!important}
.expanded-pdf-sheet .fallback-pdf{width:100%!important;height:100%!important;border:0!important;background:#fff!important}

/* V5 - Preview A4 cropado para ocupar a folha */
.expanded-pdf-sheet.pdf-canvas-ready{background:#fff!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important}
.expanded-pdf-sheet.pdf-canvas-ready canvas{width:100%!important;height:100%!important;object-fit:contain!important;background:#fff!important;display:block!important}

/* V5 - Preview segue proporção real da primeira página */
.columns.expanded .column.expanded .dropzone{
  grid-auto-rows:auto!important;
  align-items:start!important;
}
.columns.expanded .expanded-pdf-card{
  height:auto!important;
  min-height:0!important;
  max-height:none!important;
  aspect-ratio:auto!important;
}
.columns.expanded .expanded-pdf-sheet{
  width:95%!important;
  height:auto!important;
  min-height:0!important;
  max-height:none!important;
  aspect-ratio:auto;
  margin:0 auto!important;
  background:#fff!important;
  display:block!important;
}
.expanded-pdf-sheet.pdf-canvas-ready canvas{
  width:100%!important;
  height:100%!important;
  object-fit:fill!important;
  display:block!important;

  display:grid!important;
  grid-template-columns:repeat(auto-fill,minmax(240px,280px))!important;
  grid-auto-rows:auto!important;

<script>
const KEY='vooalto_main_catalog_v2';let state={thresholds:{low:0,med:15,high:22},orders:[],history:[]};let expandedColumn=null,currentPdfUrl=null;const cols=[['baixa','Baixa','Antes do limite médio','var(--green)'],['media','Média','A partir do limite médio','var(--yellow)'],['alta','Alta','A partir do limite alto','var(--red)'],['concluido','Concluídos','Só entra pelo botão Concluído','var(--gray)']];const $=id=>document.getElementById(id);const PDF_DB='vooalto_pdf_store_v2',PDF_STORE='pdfs';
function setTheme(t){t=t||'neo';document.documentElement.dataset.theme=t==='neo'?'':t;localStorage.setItem('vooalto_theme_v5',t);const sel=document.getElementById('themeSelect');if(sel)sel.value=t;try{parent.postMessage({type:'vooalto-theme',theme:t},'*')}catch(e){}}function loadTheme(){setTheme(localStorage.getItem('vooalto_theme_v5')||'neo')}
function today(){return new Date().toISOString().slice(0,10)}function uid(){return'o_'+Math.random().toString(36).slice(2,9)+'_'+Date.now().toString(36)}function parseDate(s){const [y,m,d]=(s||today()).split('-').map(Number);return new Date(y,m-1,d)}function daysSince(s){const a=parseDate(s),b=new Date();b.setHours(0,0,0,0);a.setHours(0,0,0,0);return Math.max(0,Math.floor((b-a)/86400000))}function normalizeStatusValue(v){v=String(v||'baixa').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();if(['concluido','concluidos','finalizado','done','completed'].includes(v))return'concluido';if(['alta','high'].includes(v))return'alta';if(['media','medio','medium'].includes(v))return'media';return'baixa'}function getLimits(o){return{med:parseInt(o?.medDays??state.thresholds.med)||15,high:parseInt(o?.highDays??state.thresholds.high)||22}}function autoStatus(o){if(normalizeStatusValue(o.status)==='concluido')return'concluido';const d=daysSince(o.createdAt),l=getLimits(o);if(d>=l.high)return'alta';if(d>=l.med)return'media';return'baixa'}function priorityRank(st){return({baixa:1,media:2,alta:3,concluido:4})[normalizeStatusValue(st)]||1}function openCount(){return state.orders.filter(o=>normalizeStatusValue(o.status)!=='concluido').length}
function openPdfDB(){return new Promise((res,rej)=>{const r=indexedDB.open(PDF_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(PDF_STORE))r.result.createObjectStore(PDF_STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function storePdfData(id,data){const db=await openPdfDB();return new Promise((res,rej)=>{const tx=db.transaction(PDF_STORE,'readwrite');tx.objectStore(PDF_STORE).put(data,id);tx.oncomplete=()=>{db.close();res(true)};tx.onerror=()=>{db.close();rej(tx.error)}})}const _pdfDataCache=new Map();async function getPdfData(id){if(_pdfDataCache.has(id))return _pdfDataCache.get(id);const mem=state.orders.find(o=>o.id===id)?.pdfData;if(mem){_pdfDataCache.set(id,mem);return mem;}try{const db=await openPdfDB();const data=await new Promise((res,rej)=>{const tx=db.transaction(PDF_STORE,'readonly'),rq=tx.objectStore(PDF_STORE).get(id);rq.onsuccess=()=>{db.close();res(rq.result||null)};rq.onerror=()=>{db.close();rej(rq.error)}});if(data)_pdfDataCache.set(id,data);return data}catch(e){return null}}async function deletePdfData(id){try{const db=await openPdfDB();return await new Promise((res,rej)=>{const tx=db.transaction(PDF_STORE,'readwrite');tx.objectStore(PDF_STORE).delete(id);tx.oncomplete=()=>{db.close();res(true)};tx.onerror=()=>{db.close();rej(tx.error)}})}catch(e){}}
function normalizeImportedData(data){data=data||{};data.thresholds={low:0,med:15,high:22,...(data.thresholds||{})};data.orders=(data.orders||[]).map(o=>({id:o.id||uid(),name:o.name||'Ficha sem nome',clientPhone:o.clientPhone||o.whatsapp||o.phone||'',createdAt:o.createdAt||today(),createdTs:o.createdTs||Date.now(),status:normalizeStatusValue(o.status),note:o.note||'',medDays:o.medDays??data.thresholds.med,highDays:o.highDays??data.thresholds.high,pdfData:o.pdfData,pdfName:o.pdfName,completedAt:o.completedAt,manual:o.manual,pdfStored:o.pdfStored||!!o.pdfName}));data.history=data.history||[];return data}function load(){try{const raw=localStorage.getItem(KEY)||localStorage.getItem('vooalto_main_catalog_v1');if(raw)state=normalizeImportedData(JSON.parse(raw))}catch(e){}state=normalizeImportedData(state);$('thLow').value=state.thresholds.low;$('thMed').value=state.thresholds.med;$('thHigh').value=state.thresholds.high}function save(){const clone=JSON.parse(JSON.stringify(state));(clone.orders||[]).forEach(o=>{if(o.pdfData){o.pdfStored=true;delete o.pdfData}});localStorage.setItem(KEY,JSON.stringify(clone))}function refreshAutomaticStages(){let ch=false;state.orders.forEach(o=>{o.status=normalizeStatusValue(o.status);if(o.status==='concluido')return;const due=autoStatus(o);if(priorityRank(due)>priorityRank(o.status)){o.status=due;ch=true}});if(ch)save()}async function migratePdfsToDB(){let ch=false;for(const o of state.orders){if(o.pdfData){try{await storePdfData(o.id,o.pdfData);delete o.pdfData;o.pdfStored=true;ch=true}catch(e){}}}if(ch)save()}
function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(id==='dashboard'&&i===0)||(id==='catalogo'&&i===1)));renderAll()}function filteredOrders(){const q=($('search')?.value||'').toLowerCase().trim();return state.orders.filter(o=>!q||o.name.toLowerCase().includes(q)||(o.note||'').toLowerCase().includes(q)||(o.clientPhone||'').toLowerCase().includes(q))}function statusCounts(){return{baixa:count('baixa'),media:count('media'),alta:count('alta'),concluido:count('concluido')}}function count(k){return state.orders.filter(o=>normalizeStatusValue(o.status||autoStatus(o))===k).length}
function renderAll(){refreshAutomaticStages();renderDashboard();renderCatalog()}function renderDashboard(){const c=statusCounts(),total=state.orders.length,active=total-c.concluido,avg=active?Math.round(state.orders.filter(o=>normalizeStatusValue(o.status)!=='concluido').reduce((s,o)=>s+daysSince(o.createdAt),0)/active):0;$('kpis').innerHTML=`${kpi('Total',total,'fichas cadastradas')}${kpi('Em produção',active,'baixa + média + alta')}${kpi('Alta prioridade',c.alta,'atenção máxima')}${kpi('Concluídos',c.concluido,'finalizados')}${kpi('Tempo médio',avg+'d','em aberto')}`;renderWeekly();renderPie(c,total);renderAge();renderUrgent();renderClients()}function kpi(a,b,c){return`<div class="kpi"><span>${a}</span><b>${b}</b><small>${c}</small></div>`}
function renderWeekly(){const weeks=[],now=weekStart(new Date());for(let i=7;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i*7);weeks.push({start:d,label:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),count:0})}state.orders.forEach(o=>{const ws=weekStart(parseDate(o.createdAt)).getTime(),w=weeks.find(x=>x.start.getTime()===ws);if(w)w.count++});const max=Math.max(1,...weeks.map(w=>w.count));$('weeklyChart').innerHTML='<div class="weekly">'+weeks.map(w=>`<div class="week-col" style="height:${Math.max(6,w.count/max*100)}%"><b>${w.count}</b><span>${w.label}</span></div>`).join('')+'</div>'}function weekStart(date){const d=new Date(date);d.setHours(0,0,0,0);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d}
function renderPie(c,total){let acc=0,vals=[['Baixa',c.baixa,'var(--green)'],['Média',c.media,'var(--yellow)'],['Alta',c.alta,'var(--red)'],['Concluídos',c.concluido,'var(--gray)']];const seg=vals.map(v=>{const pct=total?v[1]/total*100:0,part=`${v[2]} ${acc}% ${acc+pct}%`;acc+=pct;return part}).join(',');$('priorityPie').style.background=`conic-gradient(${seg||'var(--gray) 0 100%'})`;$('priorityLegend').innerHTML=vals.map(v=>`<div><i style="background:${v[2]}"></i>${v[0]} · <b>${v[1]}</b></div>`).join('')}
function renderAge(){const b=[['0-7d',0,'var(--green)'],['8-14d',0,'var(--blue)'],['15-21d',0,'var(--yellow)'],['22+d',0,'var(--red)']];state.orders.filter(o=>normalizeStatusValue(o.status)!=='concluido').forEach(o=>{const d=daysSince(o.createdAt);if(d<=7)b[0][1]++;else if(d<=14)b[1][1]++;else if(d<=21)b[2][1]++;else b[3][1]++});renderBars('ageBars',b)}function renderBars(id,items){const max=Math.max(1,...items.map(i=>i[1]));$(id).innerHTML=items.map(i=>`<div class="bar-row"><div class="bar-label">${i[0]}</div><div class="bar-track"><div class="bar-fill" style="width:${i[1]/max*100}%;background:${i[2]}"></div></div><b>${i[1]}</b></div>`).join('')}function renderUrgent(){const arr=state.orders.filter(o=>normalizeStatusValue(o.status)!=='concluido').sort((a,b)=>daysSince(b.createdAt)-daysSince(a.createdAt)).slice(0,8);$('urgentList').innerHTML=arr.length?arr.map(o=>`<div class="urgent-item"><b>${esc(o.name)}</b><br><span>${fmtDate(o.createdAt)} · ${daysSince(o.createdAt)} dias · ${label(o.status)}</span></div>`).join(''):'<div class="empty">Nenhum pedido em aberto</div>'}function renderClients(){const c={};state.orders.forEach(o=>{const k=(o.clientPhone||'').trim();if(k)c[k]=(c[k]||0)+1});const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8);$('clientList').innerHTML=arr.length?arr.map(x=>`<div class="bar-row"><div class="bar-label">${esc(x[0])}</div><div class="bar-track"><div class="bar-fill" style="width:${x[1]/Math.max(...arr.map(a=>a[1]))*100}%;background:var(--blue)"></div></div><b>${x[1]}</b></div>`).join(''):'<div class="empty">Nenhum número cadastrado</div>'}
function renderCatalog(){const wrap=$('columns');if(!wrap)return;state.orders.forEach(o=>o.status=normalizeStatusValue(o.status));wrap.innerHTML='';wrap.classList.toggle('expanded',!!expandedColumn);const orders=filteredOrders();cols.forEach(([key,title,desc,color])=>{const list=orders.filter(o=>(o.status||autoStatus(o))===key);const col=document.createElement('div');col.className='column'+(expandedColumn===key?' expanded':'');col.innerHTML=`<div class="col-head"><div class="col-title"><span style="color:${color}">●</span> ${title}</div><div class="col-actions"><span class="badge">${list.length}</span><button class="expand-col" onclick="toggleColumnExpand('${key}')">${expandedColumn===key?'↙':'⛶'}</button></div></div><div class="col-desc">${desc}</div><div class="dropzone" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropOrder(event,'${key}')"></div>`;wrap.appendChild(col);const dz=col.querySelector('.dropzone');if(!list.length)dz.innerHTML='<div class="empty">Nenhuma ficha aqui</div>';list.sort((a,b)=>daysSince(b.createdAt)-daysSince(a.createdAt)).forEach(o=>dz.appendChild(card(o)))});if(expandedColumn)setTimeout(loadExpandedPdfCards,120)}function card(o){const d=daysSince(o.createdAt),l=getLimits(o),st=normalizeStatusValue(o.status||autoStatus(o)),hot=d>=l.high&&st!=='concluido';const el=document.createElement('div');if(expandedColumn){el.className='order-card expanded-pdf-card '+st;el.dataset.orderId=o.id;el.onclick=()=>viewPdf(o.id);el.innerHTML=`<div class="expanded-pdf-date">${fmtDate(o.createdAt)}</div><div class="expanded-pdf-sheet" data-expanded-pdf="${o.id}"><div class="expanded-pdf-loading">Carregando ficha...</div></div>`;return el}el.className='order-card '+st;el.dataset.orderId=o.id;el.draggable=true;el.ondragstart=e=>e.dataTransfer.setData('text/plain',o.id);const fichaBtn=o.fichaData?`<button class="mini ficha" onclick="editarFichaTecnica('${o.id}')">✏️ Modificar Ficha</button>`:'';el.innerHTML=`<div class="card-top"><div><div class="order-title">${esc(o.name)}</div>${o.clientPhone?`<div class="client-phone">📱 ${esc(o.clientPhone)}</div>`:''}</div><div class="days ${hot?'hot':''}">${st==='concluido'?'Finalizado':d+' dias'}</div></div><button class="pdf-open-btn" onclick="viewPdf('${o.id}')">📄 Visualizar PDF</button><div class="meta"><div><span>Entrada</span><b>${fmtDate(o.createdAt)}</b></div><div><span>Urgência</span><b>M ${l.med}d · A ${l.high}d</b></div><div><span>PDF</span><b>${o.pdfName?esc(o.pdfName):'Sem anexo'}</b></div><div><span>Status</span><b>${label(st)}</b></div></div>${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:''}<div class="card-actions">${fichaBtn}<button class="mini view" onclick="viewPdf('${o.id}')">👁 Ver PDF</button><button class="mini done" onclick="markDone('${o.id}')" ${st==='concluido'?'disabled':''}>✔ Concluído</button><button class="mini edit" onclick="openOrderModal('${o.id}')">Editar</button><button class="mini del" onclick="deleteOrder('${o.id}')">Excluir</button></div>`;return el}

/* ═══ PDF PREVIEW SYSTEM — optimized ═══ */
let pdfJsLoadingPromise=null;
const _thumbCache=new Map();
const _thumbCacheHQ=new Map();
const _pdfDocCache=new Map();

function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfJsLoadingPromise) return pdfJsLoadingPromise;
  pdfJsLoadingPromise=new Promise((resolve,reject)=>{
    const sc=document.createElement('script');
    sc.src='./assets/pdf.min.js';
    sc.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='./assets/pdf.worker.min.js';resolve(window.pdfjsLib)}catch(e){reject(e)}};
    sc.onerror=()=>reject(new Error('pdf.js nao carregou'));
    document.head.appendChild(sc);
  });
  return pdfJsLoadingPromise;
}
function dataUrlToUint8Array(d){const b=atob(d.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}

/* Pre-load pdf.js on page load */
setTimeout(()=>ensurePdfJs().catch(()=>{}),500);

/* Low-res thumbnail for hover preview (scale 1.5 ≈ instant) */
async function getThumbLo(id){
  if(_thumbCache.has(id)) return _thumbCache.get(id);
  const data=await getPdfData(id);
  if(!data||!String(data).startsWith('data:application/pdf')){return null;}
  const pdfjs=await ensurePdfJs();
  let pdf=_pdfDocCache.get(id);
  if(!pdf){pdf=await pdfjs.getDocument({data:dataUrlToUint8Array(data)}).promise;_pdfDocCache.set(id,pdf);}
  const page=await pdf.getPage(1);
  const vp=page.getViewport({scale:1.5});
  const canvas=document.createElement('canvas');
  canvas.width=Math.floor(vp.width);canvas.height=Math.floor(vp.height);
  const ctx=canvas.getContext('2d',{alpha:false});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  _thumbCache.set(id,canvas);
  return canvas;
}

/* High-res thumbnail for expanded view (scale 2.5) */
async function getThumbHQ(id){
  if(_thumbCacheHQ.has(id)) return _thumbCacheHQ.get(id);
  const data=await getPdfData(id);
  if(!data||!String(data).startsWith('data:application/pdf')){return null;}
  const pdfjs=await ensurePdfJs();
  let pdf=_pdfDocCache.get(id);
  if(!pdf){pdf=await pdfjs.getDocument({data:dataUrlToUint8Array(data)}).promise;_pdfDocCache.set(id,pdf);}
  const page=await pdf.getPage(1);
  const vp=page.getViewport({scale:2.5});
  const canvas=document.createElement('canvas');
  canvas.width=Math.floor(vp.width);canvas.height=Math.floor(vp.height);
  const ctx=canvas.getContext('2d',{alpha:false});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  _thumbCacheHQ.set(id,canvas);
  return canvas;
}

async function renderPdfFirstPageCanvas(dataUrl,box){
  try{
    if(!String(dataUrl).startsWith('data:application/pdf')) return false;
    const pdfjs=await ensurePdfJs();
    const pdf=await pdfjs.getDocument({data:dataUrlToUint8Array(dataUrl)}).promise;
    const page=await pdf.getPage(1);
    const baseViewport=page.getViewport({scale:1});
    box.style.aspectRatio='210 / 297';
    const sheetW=box.clientWidth||247;
    const sheetH=sheetW*(297/210);
    const scale=Math.min(sheetW/baseViewport.width,sheetH/baseViewport.height)*2.5;
    const viewport=page.getViewport({scale});
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d',{alpha:false});
    canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    await page.render({canvasContext:ctx,viewport}).promise;
    box.innerHTML='';box.classList.add('pdf-canvas-ready');
    canvas.style.width='100%';canvas.style.height='100%';canvas.style.objectFit='contain';canvas.style.display='block';
    box.appendChild(canvas);
    return true;
  }catch(e){console.warn('Falha no preview canvas PDF:',e);return false;}
}

/* Parallel loading — all cards render at once */
async function loadExpandedPdfCards(){
  const boxes=[...document.querySelectorAll('[data-expanded-pdf]')];
  const tasks=boxes.filter(b=>b.dataset.loaded!=='1').map(async(box)=>{
    const id=box.dataset.expandedPdf;
    try{
      const thumb=await getThumbHQ(id);
      if(thumb){
        box.innerHTML='';box.classList.add('pdf-canvas-ready');
        const display=thumb.cloneNode(true);
        display.style.width='100%';display.style.height='100%';display.style.objectFit='contain';display.style.display='block';
        box.appendChild(display);box.dataset.loaded='1';
      }else{
        const data=await getPdfData(id);
        if(!data){box.innerHTML='<div class="expanded-pdf-empty">Sem PDF anexado</div>';box.dataset.loaded='1';}
        else{box.style.height='380px';box.innerHTML='<iframe class="fallback-pdf" loading="lazy" src="'+data+'#page=1&zoom=page-fit&toolbar=0&navpanes=0&scrollbar=0"></iframe>';box.dataset.loaded='1';}
      }
    }catch(e){box.innerHTML='<div class="expanded-pdf-empty">Erro ao carregar</div>';box.dataset.loaded='1';}
  });
  await Promise.all(tasks);
}

on readPdfFile(file,cb){if(!(file&&(file.type==='application/pdf'||/\.pdf$/i.test(file.name))))return toast('Anexe apenas PDF.');const r=new FileReader();r.onload=e=>cb(e.target.result,file.name);r.readAsDataURL(file)}function markDone(id){const o=state.orders.find(x=>x.id===id);if(!o)return;o.status='concluido';o.completedAt=today();addHistory('done',-1);save();renderAll()}function deleteOrder(id){if(!confirm('Excluir ficha?'))return;const o=state.orders.find(x=>x.id===id);if(o&&o.status!=='concluido')addHistory('delete',-1);deletePdfData(id);state.orders=state.orders.filter(x=>x.id!==id);save();renderAll()}async function viewPdf(id){const o=state.orders.find(x=>x.id===id),data=o?await getPdfData(id):null;if(!data)return toast('PDF não encontrado.');try{if(currentPdfUrl)URL.revokeObjectURL(currentPdfUrl);const res=await fetch(data),blob=await res.blob();currentPdfUrl=URL.createObjectURL(blob);$('pdfFrame').src=currentPdfUrl}catch(e){$('pdfFrame').src=data}$('pdfTitle').textContent=o.name;$('pdfModal').classList.add('open')}function closePdf(){$('pdfFrame').src='about:blank';$('pdfModal').classList.remove('open');if(currentPdfUrl)URL.revokeObjectURL(currentPdfUrl)}function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}function dragLeave(e){e.currentTarget.classList.remove('drag-over')}function dropOrder(e,status){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('drag-over');const files=[...(e.dataTransfer.files||[])];if(files.length)return handleDroppedFiles(files,status);const id=e.dataTransfer.getData('text/plain'),o=state.orders.find(x=>x.id===id);if(!o)return;if(status==='concluido')return toast('Use o botão Concluído.');o.status=status;save();renderAll()}function pageDragOver(e){if([...(e.dataTransfer?.types||[])].includes('Files')){e.preventDefault();$('mainArea').classList.add('drag-over')}}function pageDragLeave(e){$('mainArea').classList.remove('drag-over')}function pageDrop(e){const files=[...(e.dataTransfer?.files||[])];if(files.length){e.preventDefault();$('mainArea').classList.remove('drag-over');handleDroppedFiles(files,'baixa')}}function handleDroppedFiles(files,status='baixa'){files.filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name)).forEach(file=>readPdfFile(file,async(data,n)=>{const title=prompt('Nome da ficha técnica:',n.replace(/\.pdf$/i,''));if(!title)return;const o={id:uid(),name:title,clientPhone:'',createdAt:today(),createdTs:Date.now(),note:'',medDays:state.thresholds.med,highDays:state.thresholds.high,pdfName:n,pdfStored:true,status};await storePdfData(o.id,data).catch(()=>o.pdfData=data);o.status=autoStatus(o);state.orders.push(o);addHistory('add',+1);save();renderAll()}))}

<script id="v6-pdf-drop-fix-js">
/* ============================================================
   V6 — Correção do arrastar-e-soltar de PDF
   ------------------------------------------------------------
   Problemas corrigidos:
   1) TRAVAMENTO: não havia guarda global de drop. Soltar o PDF
      alguns pixels fora da zona (cabeçalho, laterais, espaços
      vazios) fazia o navegador ABRIR o arquivo por cima do app,
      substituindo a tela — parecia que "travou".
   2) NÃO FUNCIONA: a zona de drop era só o #mainArea. Soltar em
      qualquer outro ponto era ignorado sem nenhum aviso.
   3) Arquivo não-PDF era descartado em silêncio.
   4) Vários PDFs de uma vez abriam um prompt() atrás do outro.
   5) Falha ao ler ou ao gravar o PDF não avisava nada.
   ============================================================ */
(function(){
  'use strict';

  function toastSafe(msg){ try{ toast(msg); }catch(e){ try{console.log(msg)}catch(_){} } }
  const ehPDF = f => !!f && (f.type==='application/pdf' || /\.pdf$/i.test(f.name||''));

  /* ---------- 1) Guarda global: nunca deixar o navegador abrir o arquivo ---------- */
  /* Sem isso, soltar fora da zona navega a página inteira para o PDF. */
  ['dragover','drop'].forEach(tipo=>{
    window.addEventListener(tipo, e=>{
      const temArquivo = [...((e.dataTransfer&&e.dataTransfer.types)||[])].includes('Files');
      if(!temArquivo) return;
      if(e.__vooaltoTratado) return;   // já tratado por uma zona específica
      e.preventDefault();              // impede a navegação
      if(tipo==='drop'){
        const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])];
        marcarArrasto(false);
        if(files.length) receberArquivos(files,'baixa');
      }else{
        if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
        marcarArrasto(true);
      }
    }, false);
  });

  window.addEventListener('dragleave', e=>{
    if(e.relatedTarget===null) marcarArrasto(false);  /* saiu da janela */
  });
  window.addEventListener('dragend', ()=>marcarArrasto(false));

  function marcarArrasto(ativo){
    const el=document.getElementById('mainArea');
    if(el) el.classList.toggle('drag-over',!!ativo);
    let ov=document.getElementById('v6DropOverlay');
    if(ativo && !ov){
      ov=document.createElement('div');
      ov.id='v6DropOverlay';
      ov.style.cssText='position:fixed;inset:0;z-index:99997;pointer-events:none;'+
        'background:rgba(37,99,235,.10);border:3px dashed #2563EB;border-radius:14px;'+
        'display:flex;align-items:center;justify-content:center';
      ov.innerHTML='<div style="background:#111827;color:#fff;padding:12px 22px;border-radius:999px;'+
        'font-weight:900;font-size:14px;box-shadow:0 12px 40px rgba(0,0,0,.35)">📄 Solte o PDF para adicionar</div>';
      document.body.appendChild(ov);
    }else if(!ativo && ov){ ov.remove(); }
  }

  /* ---------- 2) Marcar eventos tratados pelas zonas existentes ---------- */
  /* As zonas (colunas do catálogo) continuam funcionando; só avisamos a
     guarda global para ela não processar o mesmo arquivo duas vezes. */
  document.addEventListener('drop', e=>{
    if(e.target && e.target.closest && e.target.closest('.dropzone')) e.__vooaltoTratado=true;
  }, true);

  /* ---------- 3) Leitura robusta ---------- */
  function lerPDF(file){
    return new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload = e=>resolve(e.target.result);
      r.onerror = ()=>reject(new Error('Falha ao ler "'+file.name+'"'));
      r.onabort = ()=>reject(new Error('Leitura de "'+file.name+'" cancelada'));
      try{ r.readAsDataURL(file); }catch(err){ reject(err); }
    });
  }

  /* ---------- 4) Fluxo principal, com feedback em cada passo ---------- */
  let ocupado=false;

  async function receberArquivos(files, status='baixa'){
    if(ocupado){ toastSafe('Aguarde: ainda processando o arquivo anterior.'); return; }

    const pdfs = files.filter(ehPDF);
    const outros = files.length - pdfs.length;

    if(!pdfs.length){
      toastSafe(outros===1 ? 'Esse arquivo não é PDF. Anexe um arquivo .pdf.'
                           : 'Nenhum PDF encontrado. Anexe arquivos .pdf.');
      return;
    }
    if(outros>0) toastSafe(outros+' arquivo(s) ignorado(s): só PDF é aceito.');

    ocupado=true;
    let adicionados=0;
    try{
      for(const file of pdfs){
        /* Arquivo vazio/corrompido */
        if(file.size===0){ toastSafe('"'+file.name+'" está vazio e foi ignorado.'); continue; }

        const sugestao=(file.name||'Ficha').replace(/\.pdf$/i,'');
        const titulo=prompt('Nome da ficha técnica:', sugestao);
        if(titulo===null) continue;              /* cancelou este arquivo */
        const nome=(titulo||'').trim()||sugestao;

        let data;
        try{ data=await lerPDF(file); }
        catch(err){ console.error(err); toastSafe('⚠ '+err.message); continue; }

        const o={ id:uid(), name:nome, clientPhone:'', createdAt:today(), createdTs:Date.now(),
                  note:'', medDays:state.thresholds.med, highDays:state.thresholds.high,
                  pdfName:file.name, pdfStored:false, status };

        let guardou=false;
        try{ await storePdfData(o.id,data); guardou=true; }
        catch(err){ console.error('Falha ao gravar PDF:',err); }

        if(guardou){ o.pdfStored=true; }
        else{
          /* Não conseguiu gravar: mantém em memória para a sessão e avisa,
             em vez de perder o anexo em silêncio. */
          o.pdfData=data; o.pdfStored=false;
          toastSafe('⚠ "'+file.name+'" foi anexado, mas não pôde ser guardado permanentemente (armazenamento cheio?).');
        }

        o.status=autoStatus(o);
        state.orders.push(o);
        addHistory('add',+1);
        adicionados++;
      }

      if(adicionados){
        save();
        renderAll();
        toastSafe('✔ '+adicionados+' ficha(s) adicionada(s).');
      }
    }catch(err){
      console.error('Erro ao processar PDFs:',err);
      toastSafe('⚠ Erro inesperado ao adicionar o PDF.');
    }finally{
      ocupado=false;
      marcarArrasto(false);
    }
  }

  /* ---------- 5) Substitui as funções antigas ---------- */
  window.handleDroppedFiles=function(files,status){ receberArquivos([...(files||[])],status||'baixa'); };

  window.pageDragOver=function(e){
    if([...((e.dataTransfer&&e.dataTransfer.types)||[])].includes('Files')){
      e.preventDefault(); marcarArrasto(true);
    }
  };
  window.pageDragLeave=function(){ /* a guarda global cuida de limpar */ };
  window.pageDrop=function(e){
    const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])];
    if(files.length){ e.preventDefault(); e.stopPropagation(); e.__vooaltoTratado=true;
      marcarArrasto(false); receberArquivos(files,'baixa'); }
  };

  /* Zonas das colunas: aceitam arquivo OU reordenação de card */
  window.dropOrder=function(e,status){
    e.preventDefault(); e.stopPropagation(); e.__vooaltoTratado=true;
    e.currentTarget.classList.remove('drag-over');
    marcarArrasto(false);
    const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])];
    if(files.length) return receberArquivos(files,status);
    const id=e.dataTransfer.getData('text/plain');
    const o=state.orders.find(x=>x.id===id);
    if(!o) return;
    if(status==='concluido') return toastSafe('Use o botão Concluído.');
    o.status=status; save(); renderAll();
  };

  /* ---------- 6) Anexo via formulário também fica robusto ---------- */
  window.readPdfFile=function(file,cb){
    if(!ehPDF(file)){ toastSafe('Anexe apenas PDF.'); return; }
    lerPDF(file).then(d=>cb(d,file.name))
                .catch(err=>{ console.error(err); toastSafe('⚠ '+err.message); });
  };
})();
</script>


<script id="v6-catalogo-resiliencia-js">
/* ============================================================
   V6 — Blindagem do catálogo (Principal)
   ------------------------------------------------------------
   Mesma classe de problema já corrigida na Ficha Técnica:
   gravação sem tratamento de erro + dado de entrada sem validação.

   1) save() gravava tudo no localStorage sem try/catch. Com o
      armazenamento cheio, a exceção interrompia o fluxo: a ficha
      recém-criada sumia da tela e era perdida, sem nenhum aviso.
   2) importData() fazia JSON.parse sem try/catch e substituía o
      state inteiro. Importar um arquivo corrompido — ou, pior, um
      JSON de FICHA TÉCNICA por engano — apagava todo o catálogo
      sem confirmação e sem volta.
   3) load() sem defesa contra JSON corrompido no localStorage.
   ============================================================ */
(function(){
  'use strict';

  function toastSafe(msg){ try{ toast(msg); }catch(e){ try{console.log(msg)}catch(_){} } }
  const KEY_BAK='vooalto_main_catalog_v2_backup';

  /* ---------- 1) save() tolerante a falhas ---------- */
  if(typeof window.save==='function' && !window.__v6SavePatch){
    window.__v6SavePatch=true;

    window.save=function(){
      let payload;
      try{
        const clone=JSON.parse(JSON.stringify(state));
        (clone.orders||[]).forEach(o=>{ if(o.pdfData){ o.pdfStored=true; delete o.pdfData; } });
        payload=JSON.stringify(clone);
      }catch(e){
        console.error('Falha ao preparar os dados do catálogo:',e);
        toastSafe('⚠ Erro ao preparar os dados. Nada foi alterado.');
        return false;
      }

      try{
        localStorage.setItem('vooalto_main_catalog_v2',payload);
        /* cópia de segurança rotativa, para o caso de corrupção */
        try{ localStorage.setItem(KEY_BAK,payload); }catch(e){}
        return true;
      }catch(e){
        console.error('Falha ao gravar o catálogo:',e);
        /* Última tentativa: libera espaço descartando lixo conhecido */
        try{
          localStorage.removeItem(KEY_BAK);
          localStorage.removeItem('va3_layers');
          localStorage.setItem('vooalto_main_catalog_v2',payload);
          toastSafe('⚠ Armazenamento quase cheio. Liberei espaço, mas exporte um backup.');
          return true;
        }catch(e2){
          /* Não conseguiu: avisa de forma inequívoca em vez de perder calado */
          toastSafe('❌ ARMAZENAMENTO CHEIO — a alteração NÃO foi salva. '+
                    'Exporte um backup e remova fichas antigas antes de continuar.');
          try{
            alert('❌ Não foi possível salvar o catálogo: o armazenamento do navegador está cheio.\n\n'+
                  'O que fazer agora:\n'+
                  '1) Clique em "Exportar backup" para não perder nada;\n'+
                  '2) Exclua fichas antigas que já foram concluídas;\n'+
                  '3) Refaça a última alteração.\n\n'+
                  'Atenção: a última alteração ainda NÃO está salva.');
          }catch(e3){}
          return false;
        }
      }
    };
  }

  /* ---------- 2) Importação validada e reversível ---------- */
  if(typeof window.importData==='function' && !window.__v6ImportPatch){
    window.__v6ImportPatch=true;

    function pareceBackupDoCatalogo(d){
      if(!d || typeof d!=='object') return false;
      if(Array.isArray(d.orders)) return true;                 /* formato esperado */
      return false;
    }
    function pareceFichaTecnica(d){
      return !!(d && typeof d==='object' &&
                typeof d._version==='string' && d._version.indexOf('vooalto_ficha')===0);
    }

    window.importData=function(e){
      const input=e && e.target;
      const f=input && input.files && input.files[0];
      if(!f) return;

      const r=new FileReader();

      r.onerror=()=>{ toastSafe('⚠ Não foi possível ler o arquivo.'); if(input) input.value=''; };

      r.onload=async ev=>{
        if(input) input.value='';
        let bruto;

        /* 2a) arquivo precisa ser JSON válido */
        try{
          bruto=JSON.parse(ev.target.result);
        }catch(err){
          console.error('Backup inválido:',err);
          toastSafe('⚠ Arquivo inválido: não é um JSON legível.');
          try{ alert('Este arquivo não é um backup válido.\n\nEscolha o arquivo gerado pelo botão "Exportar backup".'); }catch(e2){}
          return;
        }

        /* 2b) precisa ser um backup DO CATÁLOGO, não outra coisa */
        if(pareceFichaTecnica(bruto)){
          toastSafe('⚠ Esse arquivo é uma FICHA TÉCNICA, não um backup do catálogo.');
          try{ alert('Esse arquivo é uma ficha técnica (.json do Criador), não um backup do catálogo.\n\n'+
                     'Para abrir uma ficha, use o módulo Criador.\n'+
                     'Aqui, use o arquivo gerado por "Exportar backup".\n\n'+
                     'Nada foi alterado.'); }catch(e2){}
          return;
        }
        if(!pareceBackupDoCatalogo(bruto)){
          toastSafe('⚠ Arquivo não reconhecido como backup do catálogo.');
          try{ alert('Não reconheci este arquivo como um backup do catálogo.\n\nNada foi alterado.'); }catch(e2){}
          return;
        }

        /* 2c) importar SUBSTITUI tudo: exige confirmação explícita */
        const qtdNova=(bruto.orders||[]).length;
        const qtdAtual=(state && state.orders ? state.orders.length : 0);
        const ok=confirm('Importar backup?\n\n'+
          'Fichas no arquivo: '+qtdNova+'\n'+
          'Fichas atuais: '+qtdAtual+'\n\n'+
          'A importação SUBSTITUI todo o catálogo atual.'+
          (qtdAtual?'\n\nAs '+qtdAtual+' ficha(s) atuais serão removidas.':'')+
          '\n\nDeseja continuar?');
        if(!ok){ toastSafe('Importação cancelada. Nada foi alterado.'); return; }

        /* 2d) guarda como desfazer o que existe hoje */
        let anterior=null;
        try{ anterior=localStorage.getItem('vooalto_main_catalog_v2'); }catch(e2){}

        try{
          const data=normalizeImportedData(bruto);
          for(const o of (data.orders||[])){
            if(o.pdfData){
              try{ await storePdfData(o.id,o.pdfData); delete o.pdfData; o.pdfStored=true; }
              catch(err){ console.warn('PDF de "'+(o.name||o.id)+'" não pôde ser guardado:',err); }
            }
          }
          state=data;
          const gravou=save();
          load(); renderAll();
          if(gravou) toastSafe('✔ Backup importado: '+qtdNova+' ficha(s).');
        }catch(err){
          console.error('Falha na importação:',err);
          /* rollback: devolve o catálogo anterior */
          try{
            if(anterior!==null){
              localStorage.setItem('vooalto_main_catalog_v2',anterior);
              load(); renderAll();
            }
          }catch(e3){}
          toastSafe('⚠ Erro ao importar. O catálogo anterior foi restaurado.');
        }
      };

      r.readAsText(f);
    };
  }

  /* ---------- 3) load() resistente a dado corrompido ---------- */
  if(typeof window.load==='function' && !window.__v6LoadPatch){
    window.__v6LoadPatch=true;
    const loadOriginal=window.load;
    window.load=function(){
      try{
        return loadOriginal.apply(this,arguments);
      }catch(e){
        console.error('Catálogo corrompido, tentando a cópia de segurança:',e);
        try{
          const bak=localStorage.getItem(KEY_BAK);
          if(bak){
            localStorage.setItem('vooalto_main_catalog_v2',bak);
            const r=loadOriginal.apply(this,arguments);
            toastSafe('⚠ O catálogo estava corrompido e foi restaurado da cópia de segurança.');
            return r;
          }
        }catch(e2){}
        toastSafe('⚠ Não foi possível ler o catálogo salvo. Importe um backup.');
      }
    };
  }

  /* ---------- 4) Aviso preventivo de armazenamento quase cheio ---------- */
  async function checarEspaco(){
    try{
      if(!navigator.storage || !navigator.storage.estimate) return;
      const {usage,quota}=await navigator.storage.estimate();
      if(!quota) return;
      const pct=usage/quota;
      if(pct>0.85){
        toastSafe('⚠ Armazenamento em '+Math.round(pct*100)+'%. Exporte um backup e remova fichas antigas.');
      }
    }catch(e){}
  }
  setTimeout(checarEspaco,5000);
})();
</script>

<script id="v6-principal-didatico-js">
/* ============================================================
   V6 — Principal: linguagem didatica
   ------------------------------------------------------------
   Problemas: "Reclassificar", "Exportar backup" e as colunas de
   prioridade nao explicavam nada; o estado vazio ("Nenhuma ficha
   aqui") nao dizia o que fazer; nao havia ajuda no modulo.
   ============================================================ */
(function(){
  'use strict';
  const $=id=>document.getElementById(id);

  /* ---- 1) Faixa-guia no topo do catalogo ---- */
  function faixa(){
    const sec=$('catalogo');
    if(!sec||$('v6pGuia')) return;
    try{ if(localStorage.getItem('v6_guia_principal_oculta')==='1') return; }catch(e){}
    const tb=sec.querySelector('.toolbar');
    if(!tb) return;
    const d=document.createElement('div');
    d.id='v6pGuia'; d.className='v6p-guia';
    d.innerHTML='<span>📄 <b>Arraste um PDF</b> para qualquer lugar da tela para criar uma ficha</span>'+
      '<span class="v6p-sep">·</span>'+
      '<span>🖱 <b>Arraste os cartões</b> entre as colunas para mudar a prioridade</span>'+
      '<button class="v6p-x" onclick="v6pOcultarGuia()">Entendi</button>';
    tb.parentNode.insertBefore(d,tb.nextSibling);
  }
  window.v6pOcultarGuia=function(){
    const d=$('v6pGuia'); if(d) d.remove();
    try{ localStorage.setItem('v6_guia_principal_oculta','1'); }catch(e){}
  };

  /* ---- 2) Tooltips nos botoes de jargao ---- */
  function tooltips(){
    const t=[
      ['renderAll','Recarrega a lista de fichas na tela'],
      ['openOrderModal','Cadastra uma ficha manualmente (sem arrastar PDF)'],
      ['autoClassifyAll','Recalcula a prioridade de todas as fichas usando os prazos definidos ao lado'],
      ['exportData','Baixa um arquivo com TODAS as fichas e PDFs — guarde como segurança'],
      ["getElementById('importInput')",'Restaura as fichas a partir de um arquivo de backup'],
      ['switchView(\'dashboard\')','Visão geral: números e gráficos da produção'],
      ['switchView(\'catalogo\')','Quadro das fichas por prioridade']
    ];
    t.forEach(([sel,dica])=>{
      const b=document.querySelector('button[onclick*="'+sel.replace(/"/g,'\\"')+'"]');
      if(b&&!b.title) b.title=dica;
    });
    /* prazos */
    const cfg=document.querySelector('.settings');
    if(cfg&&!cfg.title) cfg.title='A partir de quantos dias uma ficha passa a ser média ou alta prioridade';
  }

  /* ---- 3) Estado vazio que ensina ---- */
  function estadoVazio(){
    document.querySelectorAll('.dropzone .empty').forEach(el=>{
      if(el.dataset.v6==='1') return;
      el.dataset.v6='1';
      const col=el.closest('.column');
      const titulo=col?(col.querySelector('.col-title')||{}).textContent||'':'';
      const ehConcluido=/Conclu/i.test(titulo);
      el.classList.add('v6p-vazio');
      el.innerHTML= ehConcluido
        ? '<div class="v6p-ico">✔</div><b>Nada finalizado ainda</b><span>As fichas aparecem aqui quando você clica em “✔ Concluído”.</span>'
        : '<div class="v6p-ico">📄</div><b>Nenhuma ficha aqui</b><span>Arraste um PDF para esta coluna<br>ou use “＋ Nova ficha”.</span>';
    });
  }

  /* ---- 4) Ajuda ---- */
  function criarAjuda(){
    if($('v6pHelpBtn')) return;
    const b=document.createElement('button');
    b.id='v6pHelpBtn'; b.textContent='?';
    b.title='Como usar o acompanhamento de produção';
    b.onclick=()=>v6pAbrirAjuda();
    document.body.appendChild(b);

    const m=document.createElement('div');
    m.id='v6pHelp';
    m.innerHTML=`<div class="v6ph-card">
      <div class="v6ph-head"><h3>🏠 Como acompanhar a produção</h3>
        <button onclick="v6pFecharAjuda()">Fechar</button></div>
      <div class="v6ph-body">
        <div class="v6ph-step"><div class="v6ph-n">1</div><div>
          <b>Cadastre a ficha</b>
          <span>O jeito mais rápido é <b>arrastar o PDF</b> para qualquer lugar da tela. Também dá para usar <b>＋ Nova ficha</b> e preencher à mão, ou enviar direto do módulo <b>Criador</b>.</span></div></div>
        <div class="v6ph-step"><div class="v6ph-n">2</div><div>
          <b>Entenda as colunas</b>
          <span>As fichas mudam de coluna sozinhas conforme os dias vão passando:</span>
          <div class="v6ph-cores">
            <div class="v6ph-bola" style="background:#34c759"></div><span><b>Baixa</b> — entrou há pouco tempo</span>
            <div class="v6ph-bola" style="background:#ffb020"></div><span><b>Média</b> — passou do prazo médio (padrão: 15 dias)</span>
            <div class="v6ph-bola" style="background:#ff3b64"></div><span><b>Alta</b> — passou do prazo alto (padrão: 22 dias), precisa de atenção</span>
            <div class="v6ph-bola" style="background:#8e8e93"></div><span><b>Concluídos</b> — só entra pelo botão “✔ Concluído”</span>
          </div></div></div>
        <div class="v6ph-step"><div class="v6ph-n">3</div><div>
          <b>Mova as fichas</b>
          <span>Arraste o cartão de uma coluna para outra para forçar a prioridade. Quando o pedido ficar pronto, clique em <b>✔ Concluído</b>.</span></div></div>
        <div class="v6ph-step"><div class="v6ph-n">4</div><div>
          <b>Ajuste os prazos</b>
          <span>Os campos <b>Baixa / Média / Alta</b> no topo definem em quantos dias a ficha muda de cor. Depois de mudar, clique em <b>Reclassificar</b> para aplicar em todas.</span></div></div>
        <div class="v6ph-tip amarelo"><b>💾 Faça backup de vez em quando</b>
          O botão <b>Exportar backup</b> baixa um arquivo com todas as fichas e PDFs. Guarde esse arquivo: se trocar de computador ou limpar o navegador, é com ele que você recupera tudo.</div>
        <div class="v6ph-tip"><b>💡 Fluxo completo</b>
          Monte o orçamento no <b>Orçamento</b> → aprovado, crie a ficha no <b>Criador</b> → envie para catalogação e acompanhe aqui até concluir.</div>
      </div></div>`;
    document.body.appendChild(m);
    m.addEventListener('click',e=>{ if(e.target===m) v6pFecharAjuda(); });
  }
  window.v6pAbrirAjuda=function(){ criarAjuda(); $('v6pHelp').classList.add('open'); };
  window.v6pFecharAjuda=function(){ const m=$('v6pHelp'); if(m) m.classList.remove('open'); };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') v6pFecharAjuda(); });

  function primeiraVez(){
    try{
      if(localStorage.getItem('v6_ajuda_principal')) return;
      localStorage.setItem('v6_ajuda_principal','1');
      setTimeout(()=>v6pAbrirAjuda(),2200);
    }catch(e){}
  }

  /* o catalogo e re-renderizado o tempo todo: reaplica o estado vazio */
  if(typeof window.renderCatalog==='function' && !window.__v6RenderPatch){
    window.__v6RenderPatch=true;
    const orig=window.renderCatalog;
    window.renderCatalog=function(){ const r=orig.apply(this,arguments); try{ estadoVazio(); }catch(e){} return r; };
  }

  function iniciar(){ faixa(); tooltips(); estadoVazio(); criarAjuda(); primeiraVez(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(iniciar,700));
  else setTimeout(iniciar,700);
  setTimeout(()=>{faixa();tooltips();estadoVazio();},1800);
})();

  /* ============================================================
     V6 — Esconde a interface de apoio (o "?" e afins) na exportacao
     ------------------------------------------------------------
     Deliberadamente conservador: NAO cria CSS, NAO usa @media print
     e NAO acrescenta nenhuma tag ao documento -- este codigo mora
     dentro de um <script> que ja existia. Tentativas anteriores
     falharam justamente por mexer no CSS de impressao e por inserir
     uma tag <style> mal fechada, o que abriu faixas brancas.

     Aqui os elementos sao apenas ocultados com style.display no
     momento da exportacao e devolvidos logo depois.
     ============================================================ */
  (function(){
    var IDS=['v6HelpBtn','v6HelpModal','v6SaveStatus','v6UndoBar','v6QuickModal',
             'v6oHelpBtn','v6oHelp','v6pHelpBtn','v6pHelp','v6pGuia','v6DropOverlay',
             'v6BackupBtns'];
    var salvos=null;
    function esconder(){
      if(salvos!==null) return;
      salvos=[];
      for(var i=0;i<IDS.length;i++){
        var el=document.getElementById(IDS[i]);
        if(!el) continue;
        salvos.push({el:el,prev:el.style.display});
        el.style.display='none';
      }
    }
    function restaurar(){
      if(salvos===null) return;
      for(var i=0;i<salvos.length;i++){
        try{ salvos[i].el.style.display=salvos[i].prev||''; }catch(e){}
      }
      salvos=null;
    }
    window.addEventListener('beforeprint',esconder);
    window.addEventListener('afterprint',restaurar);
    /* rede de seguranca: se o afterprint nao vier, o foco devolve */
    window.addEventListener('focus',restaurar);

    /* PNG: html2canvas ignora @media print, entao envolvemos a funcao */
    function protegerPNG(nome){
      var orig=window[nome];
      if(typeof orig!=='function'||orig.__v6Prot) return;
      var nova=function(){
        esconder();
        var r;
        try{ r=orig.apply(this,arguments); }
        catch(e){ restaurar(); throw e; }
        if(r&&typeof r.then==='function'){
          return r.then(function(v){restaurar();return v;},
                        function(e){restaurar();throw e;});
        }
        /* As exportacoes nao devolvem promise: restauramos assim que a
           captura terminar. Detectamos isso pelo fim das chamadas ao
           html2canvas, com um limite de seguranca. */
        var t0=Date.now();
        var iv=setInterval(function(){
          if(salvos===null){ clearInterval(iv); return; }
          if(!window.__v6Capturando || Date.now()-t0>20000){ clearInterval(iv); restaurar(); }
        },250);
        return r;
      };
      nova.__v6Prot=true;
      window[nome]=nova;
    }
    /* Marca enquanto houver captura em andamento, para saber a hora certa
       de devolver os elementos (em vez de chutar um tempo fixo). */
    function marcarHtml2Canvas(){
      var h=window.html2canvas;
      if(typeof h!=='function'||h.__v6Prot) return;
      var nova=function(){
        window.__v6Capturando=(window.__v6Capturando||0)+1;
        var p;
        try{ p=h.apply(this,arguments); }
        catch(e){ window.__v6Capturando--; throw e; }
        if(p&&typeof p.then==='function'){
          return p.then(function(v){ window.__v6Capturando--; return v; },
                        function(e){ window.__v6Capturando--; throw e; });
        }
        window.__v6Capturando--;
        return p;
      };
      nova.__v6Prot=true;
      window.html2canvas=nova;
    }
    function ligar(){ marcarHtml2Canvas(); protegerPNG('exportarPNG'); protegerPNG('exportPNG'); }
    setTimeout(ligar,400); setTimeout(ligar,1800); setTimeout(ligar,3500);
  })();

</script>
