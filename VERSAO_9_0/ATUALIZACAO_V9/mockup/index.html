<!DOCTYPE html>
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040507">
<title>VOOALTO — Estúdio da peça</title>
<link rel="icon" href="../icons/icone.png">
<link rel="stylesheet" href="../assets/tema-v9.css">
<link rel="stylesheet" href="peca_editor.css">
<style>
  html,body{margin:0;height:100%;background:#040507;color:#e6ecf5;
    font-family:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden}
  #app{height:100%}
  .voltar{position:fixed;left:12px;top:12px;z-index:50}
  @media (max-width:860px){body{overflow:auto}#app{height:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script src="peca.js"></script>
<script src="peca_render.js"></script>
<script src="peca_editor.js"></script>
<script>
(function(){
  var app = document.getElementById('app');
  window.PecaEditor.montar(app, {
    onChange: function(est){ try{ localStorage.setItem('vooalto_peca_teste', JSON.stringify(est)); }catch(e){} },
    onAplicar: function(est){
      try{ localStorage.setItem('vooalto_peca_teste', JSON.stringify(est)); }catch(e){}
      alert('Peça salva neste navegador (teste do estúdio).');
    }
  });
  try{
    var salvo = JSON.parse(localStorage.getItem('vooalto_peca_teste')||'null');
    if (salvo) window.PecaEditor.carregar(salvo), window.PecaEditor.montar(app, {estado: salvo});
  }catch(e){}
})();
</script>
</body>
</html>
